name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode matching declared tools version
        run: |
          # swift-tools-version 6.2 needs an Xcode with Swift 6.2 (Xcode 26+).
          # Fail loudly listing candidates instead of silently using the runner default.
          candidates=$(ls -d /Applications/Xcode*.app | sort -V)
          echo "Installed Xcodes:"; echo "$candidates"
          selected=$(echo "$candidates" | grep -E "Xcode_2[6-9]" | tail -1)
          if [ -z "$selected" ]; then
            echo "::error::No Xcode 26+ (Swift 6.2) available on this runner"
            exit 1
          fi
          echo "Selecting $selected"
          sudo xcode-select -s "$selected"
          swift --version

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build library
        run: swift build

      - name: Run tests
        run: swift test --enable-code-coverage

      - name: Coverage report (advisory, spec 014)
        run: |
          xcrun llvm-cov report \
            ".build/out/Products/Debug/RiverpodsTests.xctest/Contents/MacOS/RiverpodsTests" \
            -instr-profile ".build/out/Products/Debug/codecov/default.profdata" \
            --summary-only | grep -E "Riverpods/(Container|Core)" || true

      - name: Build Examples
        run: cd Examples && swift build

  lint:
    name: SwiftLint
    runs-on: macos-15
    # Blocking since specs/011: violations fail CI. (--strict escalation to
    # warnings is deferred until the codebase is warning-clean.)
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --quiet

  thread-sanitizer:
    name: Thread Sanitizer
    runs-on: macos-15
    # BLOCKING since spec 014: proven race-clean locally (exit 0, zero warnings,
    # full suite) before promotion — mirrors the lint promotion path.

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode matching declared tools version
        run: |
          candidates=$(ls -d /Applications/Xcode*.app | sort -V)
          selected=$(echo "$candidates" | grep -E "Xcode_2[6-9]" | tail -1)
          if [ -z "$selected" ]; then
            echo "::error::No Xcode 26+ (Swift 6.2) available on this runner"
            exit 1
          fi
          sudo xcode-select -s "$selected"
          swift --version

      - name: Run tests under Thread Sanitizer
        # PublisherHookMainThreadTests: TSan's ~5x scheduling overhead breaks
        # their main-actor write-tracking windows (false positives, not races).
        run: swift test --sanitize=thread --skip PublisherHookMainThread

  build-ios:
    name: Build (iOS destination)
    runs-on: macos-15
    # The package declares iOS among its platforms; the macOS suite alone never
    # compiles the iOS-specific surface. Library build only (spec 012).
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode matching declared tools version
        run: |
          candidates=$(ls -d /Applications/Xcode*.app | sort -V)
          selected=$(echo "$candidates" | grep -E "Xcode_2[6-9]" | tail -1)
          if [ -z "$selected" ]; then
            echo "::error::No Xcode 26+ (Swift 6.2) available on this runner"
            exit 1
          fi
          sudo xcode-select -s "$selected"
          swift --version

      - name: Cache iOS build
        uses: actions/cache@v4
        with:
          path: .build-ios
          key: ${{ runner.os }}-ios-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Build library for iOS
        run: |
          xcodebuild build \
            -scheme StateKit \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build-ios \
            CODE_SIGNING_ALLOWED=NO
