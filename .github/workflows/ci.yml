name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build library
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build Examples
        run: cd Examples && swift build

  lint:
    name: SwiftLint
    runs-on: macos-14
    continue-on-error: true # non-blocking until the codebase is fully clean (see CODING_CONVENTIONS.md §6)
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --quiet
