name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & publish DocC
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode matching declared tools version
        run: |
          candidates=$(ls -d /Applications/Xcode*.app | sort -V)
          selected=$(echo "$candidates" | grep -E "Xcode_2[6-9]" | tail -1)
          if [ -z "$selected" ]; then
            echo "::error::No Xcode 26+ (Swift 6.2) available on this runner"
            exit 1
          fi
          sudo xcode-select -s "$selected"
          swift --version

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -scheme StateKit \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build \
            DOCC_HTML_DIR=docs-archive

      - name: Find documentation archive
        id: archive
        run: |
          archive=$(find .build -path "*StateKit.doccarchive" | head -1)
          if [ -z "$archive" ]; then
            echo "::error::No StateKit.doccarchive found under .build — docbuild produced no archive"
            exit 1
          fi
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.archive.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
