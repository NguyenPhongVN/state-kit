# SwiftLint configuration — StateKit
# See docs/engineering/CODING_CONVENTIONS.md for the human-readable rulebook.
# Run: swiftlint lint --quiet  |  autocorrect: swiftlint --fix

included:
  - Sources
  - Tests
  - Examples/CaseStudies/ReferenceExamplesApp

line_length:
  # Hard cap 160 (error). The 120 advisory was retired in spec 013: the 77
  # warnings were long doc/URL lines — wrapping them churned strings and docs.
  warning: 160
  error: 160

identifier_name:
  min_length: 2
  # `_`-prefixed names are the repo's internal-slot convention (spec 004); the
  # rule's excluded matches exact names — extend when new slots land.
  # Single-char locals are accepted idioms (test harness `h`, math locals, loop
  # vars) — 194 warnings in the 2026-11-11 sweep were all these (spec 013).
  excluded:
    - id
    - to
    - by
    - at
    - a
    - b
    - c
    - d
    - e
    - h
    - i
    - n
    - p
    - r
    - s
    - v
    - k
    - l
    - o
    - q
    - t
    - _addDependentRef
    - _erasedEffect
    - _getOrCreateBox
    - _recompute
    - _recomputePathSet
    - _registerEffect
    - _removeDependentRef
    - _safeUpdate
    - _setup
    - _state
    - _storeOverride
    - _task
    - _teardown
    - _value
    - _writeOverride

type_name:
  # The project prefixes: use* hooks (functions), SK* machinery, unprefixed Riverpod layer.
  allowed_symbols: []
  # `_`-prefixed internal box types are deliberately unpronounceable from outside
  # their module; single-letter atom fixtures (A/B/C/D) are deliberate minimal
  # test fixtures. Rule's excluded matches exact names (spec 013).
  excluded:
    - _StoreOverrideBox
    - _HookCallbackBox
    - _HookMemoBox
    - _HookReducerBox
    - _HookAsyncSequenceBox
    - _HookPublisherBox
    - A
    - B
    - C
    - D

force_unwrapping:
  severity: warning

force_try:
  severity: warning

force_cast:
  severity: warning

todo:
  severity: warning

# Existing-surface allowances: these carry written invariant justifications
# (see CODING_CONVENTIONS.md § Force conversions). New code should not add to them.
opt_in_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - contains_over_filter_count

disabled_rules:
  - trailing_comma          # formatter owns this
  - multiple_closures_with_trailing_closure  # SwiftUI-idiomatic

# Test targets may use force-unwrap freely in assertions.
excluded:
  - .build
  - DerivedData
  - Examples/CaseStudies/CaseStudies.xcodeproj
  # Tutorial chapters: long display strings/URLs; line-length wrapping hurts them.
  - Examples/CaseStudies/ReferenceExamplesApp/StartHere
  # Codegen templates: generated code must stay byte-identical to the pinned
  # expected sources in StateKitMacrosTests — long interpolation lines are inherent.
  - Sources/StateKitMacrosPlugin/Hooks/HookReducerMacro.swift
  - Sources/StateKitMacrosPlugin/Hooks/HookFormMacro.swift

# `x.count == 0` stays legal on types that only expose `count` (counters);
# the idiom fixer's `isEmpty` rewrite broke such receivers (spec 012).
# `x.count == 0` stays legal on types that only expose `count` (counters);
# the idiom fixer's `isEmpty` rewrite broke such receivers (spec 012/013).
empty_count:
  severity: warning

# Macro expansion builders and controller hooks are long by design.
function_body_length:
  warning: 120
  error: 250

# Test fixtures and integration suites are long/nested by design.
file_length:
  warning: 500
  error: 800
nesting:
  warning: 4

# By-design complexity/size allowances (spec 013 ledger):
# - ensureElement is the single dispatch point of the container graph.
# - useLoadMore encodes the whole load-more state machine in one hook.
# - DeterministicTesting tuples carry (env, time, random) test bundles.
# - AtomMacrosTests/SKAtomStore are the largest macro/store bodies.
cyclomatic_complexity:
  warning: 11
large_tuple:
  warning: 3
function_parameter_count:
  warning: 6
type_body_length:
  warning: 500
  error: 500
